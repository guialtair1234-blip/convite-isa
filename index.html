<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>convite.exe</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="mascote">😊</div>

  <div id="barraProgresso">
    <div id="barraProgressoPreenchida"></div>
  </div>

  <button id="btnMutar" onclick="alternarMudo()">🔊</button>
  <audio id="musicaFundo" loop>
    <source src="sons/fundo.mp3" type="audio/mpeg">
  </audio>

<div class="card">

    <div id="telaInicial">
      <h1 id="titulo">oii isaa!</h1>
      <div id="introTexto">
      <p>você me concederia o privilégio de sair com você novamente?👀</p>
      <p>dessa vez você vai me ajudar a escolher!</p>
    </div>

  <button id="btnContinuar" onclick="mostrarDisponibilidade()">aceito 🤠</button>
  
</div>

    <div id="disponibilidade" style="display:none;">
        <p>quando é o seu melhor dia?</p>
        <label for="dataEscolhida">dia:</label>
        <input type="date" id="dataEscolhida">

        <p>qual período você prefere? <span style="opacity:0.7; font-size:13px;"></span></p>
        <div id="periodos">
            <button class="periodo-btn" data-periodo="manha" onclick="selecionarPeriodo('manha')"> manhã</button>
            <button class="periodo-btn" data-periodo="tarde" onclick="selecionarPeriodo('tarde')"> tarde</button>
            <button class="periodo-btn" data-periodo="noite" onclick="selecionarPeriodo('noite')"> noite</button>
        </div>

        <button onclick="confirmarHorario()">confirmar opção →</button>
    </div>

    <div id="pergunta1" style="display:none;">
        <p id="p1Texto"></p>
        <div id="p1Opcoes"></div>
    </div>

    <div id="pergunta2" style="display:none;">
        <p id="p2Texto"></p>
        <div id="p2Opcoes"></div>
    </div>

    <div id="calculando" style="display:none;">
      <div class="spinner"></div>
      <p>calculando de acordo com as suas preferências...</p>
    </div>

    <div id="resultado" style="display:none;">
      <p id="texto"></p>
      <p id="dataTexto"></p>
      <div id="mapaPreview"></div>
      <a id="linkLugar" href="#" target="_blank" rel="noopener">📳 abrir o site</a>
      <button onclick="gostei()">gostei desse plano! 💚</button>
      <button onclick="recomecar()">quero outro plano 🔄</button>
    </div>

    <div id="confirmacaoFinal" style="display:none; margin-top:20px;">
      <img id="figurinha" src="imagens/figurinha.png" alt="figurinha">
      <p>posso confirmar nosso date?</p>
      <button id="btnSim" onclick="confirmar()">sim!! 🎉</button>
      <button id="btnNao" onmouseover="fugir()">não</button>
    </div>

    <img id="figurinhaFinal" src="imagens/figurinha2.png" alt="figurinha final" style="display:none;">

  </div>

  <script src="script.js"></script>
  
</body>
</html>
